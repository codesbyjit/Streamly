syntax = "proto3";
package streamflow.video;

option go_package = "github.com/codesbyjit/streamly/platform/services/content-service/proto";

message VideoRequest {
  string video_id = 1;
}

message VideoResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  int32 duration_seconds = 5;
  string channel_id = 6;
}

service VideoService {
  rpc GetVideo(VideoRequest) returns (VideoResponse);
  rpc ListVideosByChannel(ChannelRequest) returns (VideoListResponse);
}

message ChannelRequest {
  string channel_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message VideoListResponse {
  repeated VideoResponse videos = 1;
  int32 total = 2;
}